name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python3:
    name: Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bcmc
        run: python -m pip install .
      - name: Smoke test CLI
        run: bcmc -h
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  python27:
    name: Python 2.7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests on Python 2.7
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD":/src \
            -w /src \
            python:2.7 \
            -c 'python -m bcmc -h && python -m unittest discover -s tests -t /src -v'
