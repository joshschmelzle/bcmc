[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name =  "bcmc"
dynamic = ["version"]
description = "a CLI-centric broadcast and multicast validation tool"
readme = "README.md"
authors = [
  { name = "Josh Schmelzle", email = "josh@joshschmelzle.com" },
  { name = "Kevin L. Marshall" },
]
maintainers = [
  { name = "Josh Schmelzle", email = "josh@joshschmelzle.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["bcmc", "broadcast", "multicast"]
requires-python = ">=3.13"
classifiers = [
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Utilities",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/joshschmelzle/bcmc"
Source = "https://github.com/joshschmelzle/bcmc"
Issues = "https://github.com/joshschmelzle/bcmc/issues"
Changelog = "https://github.com/joshschmelzle/bcmc/releases"

[project.scripts]
bcmc = "bcmc.__main__:main"

[tool.setuptools.packages.find]
include = ["bcmc"]
exclude = ["tests", "test"]

[tool.setuptools.dynamic]
version = {attr = "bcmc.__version__"}
